name: release-generator

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v1.0.0)
        required: true
        type: string
      count:
        description: Investors per seed file (not used in binary)
        required: false
        default: "10000"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/generate-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install UPX
        run: sudo apt-get update -q && sudo apt-get install -y -q upx

      - name: Build
        run: |
          go build -ldflags="-s -w" -o generate-data .

      - name: Compress
        run: upx --best generate-data

      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/generate-data-linux-amd64.zip generate-data

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: tools/generate-data/dist/generate-data-linux-amd64.zip
          draft: false
          generate_release_notes: true
