services:
  wiremock:
    container_name: wiremock
    image: wiremock/wiremock:3.13.2
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  floci:
    container_name: floci
    image: floci/floci:1.5.33
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: aws-gluejob-floci_default
      FLOCI_STORAGE_MODE: memory
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  seed-generator:
    container_name: seed-generator
    image: alpine:3.20
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tools/generate-data/generate-data:/opt/generate-data
    entrypoint: ["/opt/generate-data"]
    command:
      - "-count=50"
      - "-family-pct=0.01"
      - "-workers=4"
      - "-dsn=postgres://admin:secret123@postgres:5432/postgres?sslmode=disable"

  glue-runner:
    container_name: glue-runner
    image: glue-scala-minimal:latest
    build:
      context: docker
    stdin_open: true
    tty: true
    depends_on:
      wiremock:
        condition: service_healthy
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      WIREMOCK_ENDPOINT: http://wiremock:8080
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./glue-job/target/scala-2.12/glue4-spark-job-assembly-1.0.jar:/opt/job.jar
      - ./scripts/glue-runner.sh:/opt/glue-runner.sh
    entrypoint: ["/bin/bash"]
    command: ["-c", "echo 'glue-runner ready. Submit jobs with: docker exec glue-runner bash /opt/glue-runner.sh' && sleep infinity"]
